name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crypto: [openssl, bundled]
    name: build+sigv4 (crypto=${{ matrix.crypto }})
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNANOS3READER_CRYPTO=${{ matrix.crypto }}

      - name: Build
        run: cmake --build build -j

      - name: Test (SigV4 known-answer, no network)
        run: ctest --test-dir build --output-on-failure

  integration:
    runs-on: ubuntu-latest
    name: minio-integration
    env:
      # Any credentials work against the local S3 server; they double as what the reader resolves from the environment.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:9000
      BUCKET: nanos3reader-it
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the S3 server (moto)
        run: |
          # minio/minio can no longer be pulled from Docker Hub ("pull access denied"); moto's server speaks
          # the same S3 API (range GETs, HEAD, ListObjectsV2), accepts any credentials and needs no Docker.
          python -m pip install --quiet "moto[server]==5.2.4"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "${AWS_ENDPOINT_URL}/"; then echo "S3 server ready"; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "${AWS_ENDPOINT_URL}/"

      - name: Seed test object
        run: |
          # ~1 MiB of random bytes so a small read-ahead spans many windows. The reader is checked against
          # this exact local copy, so the content need not be deterministic.
          head -c 1048576 /dev/urandom > obj.bin
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 mb "s3://${BUCKET}"
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp obj.bin "s3://${BUCKET}/data/obj.bin"
          # Listing fixture for the S3Client checks: 1,100 objects f00000.bin..f01099.bin (object i has
          # 1 + i % 13 bytes; more than one 1,000-key page) plus sub/one.bin (3 bytes).
          mkdir -p listing/sub
          for i in $(seq 0 1099); do head -c $((1 + i % 13)) /dev/zero > "listing/$(printf 'f%05d.bin' "$i")"; done
          head -c 3 /dev/zero > listing/sub/one.bin
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 sync listing "s3://${BUCKET}/listing/"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNANOS3READER_BUILD_INTEGRATION_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test (MinIO integration, real range GETs)
        env:
          NANOS3READER_IT_URI: s3://nanos3reader-it/data/obj.bin
          NANOS3READER_IT_EXPECT: ${{ github.workspace }}/obj.bin
          NANOS3READER_IT_MISSING: s3://nanos3reader-it/data/does-not-exist.bin
          NANOS3READER_IT_LISTING: s3://nanos3reader-it/listing/
          NANOS3READER_IT_PUT_PREFIX: s3://nanos3reader-it/put/
        run: ctest --test-dir build --output-on-failure -R minio_integration

      - name: s3put (directory upload, same layout as Path.rglob)
        run: |
          mkdir -p tree/"sub dir"/deeper
          head -c 12000000 /dev/urandom > tree/big.bin            # multipart with --multipart-threshold 8
          echo one > tree/a.txt
          echo two > "tree/sub dir/b c.txt"
          : > tree/sub\ dir/deeper/empty.bin
          ./build/s3put --multipart-threshold 8 --part-size 5 tree "s3://${BUCKET}/s3put/run1/"
          ./build/s3put tree/a.txt "s3://${BUCKET}/s3put/single/"
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp --recursive "s3://${BUCKET}/s3put/run1/" back
          diff -r tree back
          test "$(aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 ls --recursive "s3://${BUCKET}/s3put/run1/" | wc -l)" -eq 4
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp "s3://${BUCKET}/s3put/single/a.txt" - | grep -qx one
          if ./build/s3put tree "s3://${BUCKET}-missing/x/"; then echo "expected a failure"; exit 1; fi
          if ./build/s3put does-not-exist "s3://${BUCKET}/x/"; then echo "expected a failure"; exit 1; fi

      - name: S3 server log (on failure)
        if: failure()
        run: cat moto.log || true

  python-integration:
    runs-on: ubuntu-latest
    name: python-bindings-minio
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:9000
      BUCKET: nanos3reader-it
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev python3 python3-pip python3-venv python3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the S3 server (moto)
        run: |
          # minio/minio can no longer be pulled from Docker Hub ("pull access denied"); moto's server speaks
          # the same S3 API (range GETs, HEAD, ListObjectsV2), accepts any credentials and needs no Docker.
          python -m pip install --quiet "moto[server]==5.2.4"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "${AWS_ENDPOINT_URL}/"; then echo "S3 server ready"; break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "${AWS_ENDPOINT_URL}/"

      - name: Seed test object
        run: |
          head -c 1048576 /dev/urandom > obj.bin
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 mb "s3://${BUCKET}"
          aws --endpoint-url "${AWS_ENDPOINT_URL}" s3 cp obj.bin "s3://${BUCKET}/data/obj.bin"

      - name: Build and install Python bindings
        run: pip install -e ".[test]"

      - name: Test (Python MinIO integration)
        env:
          NANOS3READER_IT_URI: s3://nanos3reader-it/data/obj.bin
          NANOS3READER_IT_EXPECT: ${{ github.workspace }}/obj.bin
          NANOS3READER_IT_PUT_PREFIX: s3://nanos3reader-it/put/
        run: pytest tests/python/test_minio_integration.py -v

      - name: S3 server log (on failure)
        if: failure()
        run: cat moto.log || true
